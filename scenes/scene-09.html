<!-- PANTALLA 9: CIERRE -->
<article class="layout final-layout">

  <div class="final-background"></div>
  <div class="final-overlay"></div>

  <!-- Flores decorativas -->
  <img
    class="floral floral-left final-floral-left"
    data-decor
    src="assets/adornos/flor-12.webp"
    alt=""
  >

  <img
    class="floral floral-right final-floral-right"
    data-decor
    src="assets/adornos/flor-8.png"
    alt=""
  >

  <div class="final-card">

    <span class="eyebrow">
      SIGUE SIENDO PARTE DE NUESTRA HISTORIA
    </span>

    <div class="final-heart">♡</div>

    <h1 class="script-title">¡Sí!</h1>

    <p class="lead">
      Y celebremos este nuevo comienzo juntos.
    </p>

    <div class="final-divider">
      <span></span>
      <b>❦</b>
      <span></span>
    </div>

    <p class="confirm-label">
      CONFIRMA TU ASISTENCIA
    </p>

    <p class="confirm-description">
      Nos encantaría contar contigo en este día tan especial.
    </p>

    <a
      class="confirm-button"
      href="{confirmation}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="whatsapp-icon">✆</span>
      Confirmar por WhatsApp
    </a>

    <p class="confirm-number">
      {contact}
    </p>

    <div class="final-footer">
      <p>Con todo nuestro cariño</p>
      <span>Jonathan & Luz Magaly</span>
    </div>

  </div>

</article>

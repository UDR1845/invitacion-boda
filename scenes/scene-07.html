<!-- PANTALLA 7: DATOS DEL EVENTO -->
<article class="layout details-layout">

  <!-- Fondo -->
  <div class="details-background"></div>
  <div class="details-overlay"></div>

  <!-- Flores decorativas -->
  <img
    class="floral floral-left details-floral-left"
    data-decor
    src="assets/adornos/flor-3.png"
    alt=""
  >

  <img
    class="floral floral-right details-floral-right"
    data-decor
    src="assets/adornos/flor-13.webp"
    alt=""
  >

  <div class="details-card">

    <span class="eyebrow">TENEMOS EL HONOR DE INVITARTE</span>

    <h1 class="script-title">A nuestra boda</h1>

    <!-- Fecha y hora -->
    <div class="date-ribbon">
      <span class="date-icon">♡</span>
      <p class="date-text">{date}</p>
      <p class="time-text">{time}</p>
    </div>

    <!-- Ceremonia -->
    <section class="event-location">

      <span class="location-icon">✧</span>

      <span class="label">CEREMONIA</span>

      <h2>Unidos ante Dios</h2>

      <p class="location-address">{addressceremony}</p>

      <a
        class="location-link"
        href="{mapsceremony}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Ver ubicación</span>
        <span>↗</span>
      </a>

    </section>

    <div class="location-separator">
      <span></span>
      ✦
      <span></span>
    </div>

    <!-- Celebración -->
    <section class="event-location">

      <span class="location-icon">❀</span>

      <span class="label">CELEBRACIÓN</span>

      <h2>Compartamos la alegría</h2>

      <p class="location-address">{addressparty}</p>

      <a
        class="location-link"
        href="{mapsparty}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Ver ubicación</span>
        <span>↗</span>
      </a>

    </section>

    <div class="details-footer">
      <p>Será un día inolvidable con tu compañía</p>
      <span>♡</span>
    </div>

  </div>

</article>
